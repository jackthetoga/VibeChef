[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-finder-backend"
version = "0.1.0"
description = "Recipe Finder API and ingestion worker"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "asyncpg>=0.30",
  "arq>=0.26",
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "greenlet>=3.1",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pwdlib[argon2]>=0.2",
  "PyJWT>=2.10",
  "PyMuPDF>=1.24",
  "python-multipart>=0.0.12",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.32",
  "pillow>=12.3.0",
  "pillow-heif>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Category SVGs are intentionally long inline art/data strings.
"app/services/recipe_images.py" = ["E501"]
