services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recipe_finder
      POSTGRES_USER: recipe_finder
      POSTGRES_PASSWORD: recipe_finder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_finder -d recipe_finder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://recipe_finder:recipe_finder@postgres:5432/recipe_finder
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: arq app.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://recipe_finder:recipe_finder@postgres:5432/recipe_finder
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: /api/v1
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads:
  frontend_node_modules:
